---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: das-secure-message-service-web
    service: das-tool-service
  name: das-secure-message-service-web
  namespace: {{KubernetesNamespace}}
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: das-secure-message-service-web
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: das-secure-message-service-web
    service: das-tool-service
  name: das-secure-message-service-web
  namespace: {{KubernetesNamespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: das-secure-message-service-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: das-secure-message-service-web
        service: das-tool-service
    spec:
      nodeSelector:
        agentpool: {{toolsAgentName}}
      containers:
        - name: das-secure-message-service
          image: {{PublicAcrName}}.azurecr.io/{{WebContainerImageName}}:{{BuildNumber}}
          imagePullPolicy: IfNotPresent
          
          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 25m
              memory: 512Mi

          envFrom:
            - configMapRef:
                name: das-tool-service-shared-config

          readinessProbe:
            httpGet:
              path: /messages/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /messages/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3